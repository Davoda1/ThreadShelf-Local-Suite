name: Build desktop packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      components:
        description: Applications to build and validate
        type: choice
        default: all
        options:
          - all
          - reader-and-alternative
          - reader
          - analytics
          - alternative
permissions:
  contents: read
jobs:
  packages:
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.components == 'reader-and-alternative' && '["reader","alternative"]' || inputs.components == 'reader' && '["reader"]' || inputs.components == 'analytics' && '["analytics"]' || inputs.components == 'alternative' && '["alternative"]' || '["reader","analytics","alternative"]') }}
        os: [ubuntu-24.04, windows-2022]
        include:
          - os: ubuntu-24.04
            target: linux
            platform: linux
          - os: windows-2022
            target: windows
            platform: win32
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Prepare and verify private npm toolchain
        run: node "${{ github.workspace }}/tools/npm.mjs" --report
      - name: Install pinned native GUI test driver
        working-directory: tools/mermaid-bundle
        run: node "${{ github.workspace }}/tools/npm.mjs" -- ci --ignore-scripts
      - name: Prepare Linux display and ordinary Chromium sandbox
        if: runner.os == 'Linux'
        working-directory: tools/mermaid-bundle
        run: |
          node node_modules/playwright-core/cli.js install-deps chromium
          # Allow the packaged Chromium user-namespace sandbox on this ephemeral runner.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Read component version
        id: component
        shell: bash
        run: node -e "const fs=require('node:fs');const p=require('./apps/${{ matrix.app }}/package.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+p.version+'\n')"
      - name: Build pinned packages
        run: python tools/build-suite.py --app ${{ matrix.app }} --target ${{ matrix.target }} --out release
      - name: Verify packages, native runtime and graphical application
        run: python tools/validate-suite.py --app ${{ matrix.app }} --platform ${{ matrix.platform }} --out release
      - name: Build Reader offline preview
        if: runner.os == 'Linux' && matrix.app == 'reader'
        run: |
          node apps/reader/scripts/preview.mjs
          cp "apps/reader/release/ThreadShelf-Local-Reader-${{ steps.component.outputs.version }}-Preview.html" release/
      - name: Build Alternative offline demo
        if: runner.os == 'Linux' && matrix.app == 'alternative'
        run: python apps/alternative/scripts/build-demo.py --output "release/ThreadShelf-Local-Alternative-${{ steps.component.outputs.version }}-Demo.html"
      - name: Verify MathJax migration and Reader file citations
        if: runner.os == 'Linux' && matrix.app == 'reader'
        timeout-minutes: 10
        env:
          THREADSHELF_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/mermaid-bundle/node_modules/playwright-core/index.mjs
          READER_ELECTRON: ${{ github.workspace }}/apps/reader/node_modules/electron/dist/electron
          READER_EVIDENCE: ${{ github.workspace }}/release/verification
          MATHJAX_BASELINE_REV: afb268b01533e1f61602db3d01d3e4160bb0835b
        run: |
          node apps/reader/scripts/ensure-electron.mjs
          git fetch --no-tags --depth=1 origin "$MATHJAX_BASELINE_REV"
          xvfb-run -a node tools/tests/mathjax-migration.mjs > release/verification/reader-linux-mathjax.json
          xvfb-run -a node apps/reader/tests/file-citations.browser.mjs
          mv release/verification/file-citations-native.json release/verification/reader-linux-file-citations.json
      - name: Verify Alternative file citations
        if: runner.os == 'Linux' && matrix.app == 'alternative'
        timeout-minutes: 10
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/tools/mermaid-bundle/node_modules/playwright-core
          CITATION_REPORT: ${{ github.workspace }}/release/verification/alternative-linux-file-citations.json
        run: |
          node tools/mermaid-bundle/node_modules/playwright-core/cli.js install chromium
          node apps/alternative/test/file-citations.browser.cjs
      - name: Record exact publication inputs
        run: python tools/assemble-release.py --record-inputs release --app ${{ matrix.app }} --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-${{ matrix.target }}-${{ steps.component.outputs.version }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.deb
            release/*.html
            release/SHA256SUM.txt
            release/verification/*.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated tagged release
    needs: packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release assembly safeguards
        run: python3 -m unittest discover -s tools/tests -p test_assemble_release.py
      - name: Download the six validated platform artifacts
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for app in reader analytics alternative; do
            for target in linux windows; do
              name="$app-$target-$version"
              gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "artifacts/$name"
            done
          done
      - name: Assemble, verify uploads and publish this tag
        run: >-
          python3 tools/assemble-release.py --artifacts artifacts --out release-assets
          --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --publish
