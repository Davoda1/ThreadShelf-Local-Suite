name: Checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Prepare and verify private npm toolchain
        run: node "${{ github.workspace }}/tools/npm.mjs" --report
      - name: Repository hygiene
        run: python3 tools/check-public-tree.py
      - name: Source companion integrity and assembly regressions
        run: |
          python3 maintainer/test-verify-release-sources.py
          python3 maintainer/test-verify-native-source-scope.py
          python3 maintainer/source-publication/test-source-parts.py
          python3 maintainer/source-publication/test-ordered-patches.py
          python3 maintainer/source-publication/test-offline-assembler.py
          python3 maintainer/source-publication/test-stream-runtime-sources.py
          python3 maintainer/source-publication/test-source-symlinks.py
          python3 maintainer/source-publication/test-patch-inputs.py
          python3 maintainer/source-publication/test-release-profiles.py
      - name: Managed npm integrity and security regressions
        run: node --test tools/tests/npm-toolchain.test.mjs
      - name: Offline diagram dependency and security regressions
        working-directory: tools/mermaid-bundle
        run: |
          node "${{ github.workspace }}/tools/npm.mjs" -- ci --ignore-scripts
          node "${{ github.workspace }}/tools/npm.mjs" -- run check
          node node_modules/playwright-core/cli.js install --with-deps chromium
          node "${{ github.workspace }}/tools/npm.mjs" -- test
      - name: Package validator regression tests
        run: |
          python3 apps/reader/tests/package-validation.test.py
          python3 apps/analytics/test/package-validation.test.py
      - name: Server patch installer safety
        run: node --test server-patch/tests/installer.test.mjs
      - name: Alternative tests
        run: node apps/alternative/scripts/test.cjs
      - name: Reader tests and build
        working-directory: apps/reader
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          node "${{ github.workspace }}/tools/npm.mjs" -- ci
          node "${{ github.workspace }}/tools/npm.mjs" -- test
          node "${{ github.workspace }}/tools/npm.mjs" -- run build
      - name: Analytics tests and build
        working-directory: apps/analytics
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          node "${{ github.workspace }}/tools/npm.mjs" -- ci
          node "${{ github.workspace }}/tools/npm.mjs" -- test
          node "${{ github.workspace }}/tools/npm.mjs" -- run build

      - name: Check out the exact public Reader 1.0.0 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Davoda1/ThreadShelf-Local-Suite
          ref: 1be2ceb8cd5fec04fc852861fc0f3173dc0d3155
          path: .verification/public-1.0.0
          sparse-checkout: apps/reader
          persist-credentials: false
      - name: Check out the exact public Reader 1.1.0 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Davoda1/ThreadShelf-Local-Suite
          ref: 07ba8221176def076c394d07ef0057fac69c59d4
          path: .verification/public-1.1.0
          sparse-checkout: apps/reader
          persist-credentials: false
      - name: Reader cache storage, archive integration and public profile upgrade
        run: node tools/check-feature-regressions.mjs integration
      - name: Reader and Alternative image, cache, visibility and ONNX WASM browser regressions
        run: node tools/check-feature-regressions.mjs browser

  windows-source:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for Windows checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Prepare and verify private npm toolchain
        run: node "${{ github.workspace }}/tools/npm.mjs" --report
      - name: Alternative source tests
        run: node apps/alternative/scripts/test.cjs
      - name: Managed npm integrity and security regressions
        run: node --test tools/tests/npm-toolchain.test.mjs
      - name: Reader managed npm PowerShell helper regression
        run: node --test apps/reader/tests/windows-toolchain.integration.mjs
      - name: Reader source tests and renderer build
        working-directory: apps/reader
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          node "${{ github.workspace }}/tools/npm.mjs" -- ci
          node "${{ github.workspace }}/tools/npm.mjs" -- test
          node "${{ github.workspace }}/tools/npm.mjs" -- run build
      - name: Analytics source tests and renderer build
        working-directory: apps/analytics
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          node "${{ github.workspace }}/tools/npm.mjs" -- ci
          node "${{ github.workspace }}/tools/npm.mjs" -- test
          node "${{ github.workspace }}/tools/npm.mjs" -- run build
      - name: Check out the exact public Reader 1.0.0 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Davoda1/ThreadShelf-Local-Suite
          ref: 1be2ceb8cd5fec04fc852861fc0f3173dc0d3155
          path: .verification/public-1.0.0
          sparse-checkout: apps/reader
          persist-credentials: false
      - name: Check out the exact public Reader 1.1.0 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Davoda1/ThreadShelf-Local-Suite
          ref: 07ba8221176def076c394d07ef0057fac69c59d4
          path: .verification/public-1.1.0
          sparse-checkout: apps/reader
          persist-credentials: false
      - name: Reader cache storage, archive integration and public profile upgrade
        run: node tools/check-feature-regressions.mjs integration

  server-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Prepare and verify private npm toolchain
        run: node "${{ github.workspace }}/tools/npm.mjs" --report
      - name: Check out the exact supported upstream server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChrystianSchutz/ThreadShelf
          ref: 3430dd04f50218fdea916b104709d24a651017fc
          path: .verification/upstream
          persist-credentials: false
      - name: Install upstream locked dependencies
        working-directory: .verification/upstream
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: node "${{ github.workspace }}/tools/npm.mjs" -- ci --ignore-scripts
      - name: Apply, query and roll back the patch with synthetic data
        run: |
          node server-patch/manage.mjs install .verification/upstream
          node server-patch/tests/run-native.mjs .verification/upstream
          node server-patch/manage.mjs uninstall .verification/upstream
          node server-patch/manage.mjs check .verification/upstream
